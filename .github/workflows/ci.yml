name: CI

# 触发：推送到任何分支、或开 Pull Request 时都跑——坏了马上知道。
on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (离线 + Postgres)
    runs-on: ubuntu-latest          # GitHub 提供的一台全新 Linux 机器
    # 集成测试连真 Postgres（dev/prod 一致）：起一个临时 PG service container，
    # 映射到 host 5433（对齐本地 docker-compose 与 conftest 默认 DATABASE_URL）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: trpg
          POSTGRES_DB: trpg        # conftest 连此库 CREATE DATABASE trpg_test
        ports:
          - 5433:5432
        # 等 PG 真的就绪再跑步骤，避免连接竞态
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # 1) 把仓库 clone 进这台机器
      - uses: actions/checkout@v4

      # 2) 装 Python；cache:pip 把依赖缓存起来，第二次跑更快
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # 3) 装依赖（含 pytest / pytest-cov；-r requirements-dev.txt 内含 -r requirements.txt）
      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      # 4) 跑测试。不打 Grok（conftest 设 dummy key），故 CI 不必持有 Grok 密钥；
      #    集成测试连上面的 PG service（conftest 默认 DATABASE_URL 即 localhost:5433/trpg_test）。
      - name: 跑 pytest
        run: pytest

  # 测试过了、且是 master 时：build Docker 镜像并推到 ECR（App Runner 之后自动拉 latest）
  build-and-push:
    name: build & push 到 ECR
    needs: test                              # 测试不过就不 build
    if: github.ref == 'refs/heads/master'    # PR / 其他分支只跑 test
    runs-on: ubuntu-latest
    permissions:
      id-token: write                        # 用 OIDC 换 AWS 临时凭证（无长期密钥）
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPO: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-1.amazonaws.com/torisu233/trpg
    steps:
      - uses: actions/checkout@v4

      - name: 经 OIDC 取得 AWS 临时凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: 登录 ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: build + push（tag：latest 与 git sha）
        run: |
          docker build -t "$ECR_REPO:latest" -t "$ECR_REPO:${{ github.sha }}" .
          docker push "$ECR_REPO:latest"
          docker push "$ECR_REPO:${{ github.sha }}"

  # build 过了：创建/更新 ECS Express 服务（吃刚推的镜像），实现 push→自动上云
  deploy:
    name: deploy 到 ECS Express
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPO: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-1.amazonaws.com/torisu233/trpg
    steps:
      - name: 经 OIDC 取得 AWS 临时凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # 部署刚 build 的那个 sha（精确部署本次产物，不靠 latest）；密钥从 GitHub secrets 注入为环境变量
      # 网络：把任务放进我们自建 VPC 的「公开子网」+ 自建 app-SG。
      #   - 公开子网 → Express 给任务分配 public IP，经 IGW 拉 ECR / 连 x.ai，免 NAT Gateway。
      #   - app-SG → RDS 安全组只放行它（确定的 SG id，避开 Express 自建 SG 的先有鸡蛋问题）。
      #   两者均存 GitHub secrets（非机密但避免硬编码资源 id）。
      - name: 部署 ECS Express（创建或更新）
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: trpg
          cluster: default
          image: ${{ env.ECR_REPO }}:${{ github.sha }}
          container-port: 8080
          health-check-path: /api/health
          execution-role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/service-role/ecsInfrastructureRoleForExpressServices
          subnets: ${{ secrets.APP_SUBNETS }}            # 逗号分隔的 2 个公开子网 id
          security-groups: ${{ secrets.APP_SG }}         # 自建 app-SG id（RDS 放行它）
          environment-variables: |
            [
              {"name":"GROK_API_KEY","value":"${{ secrets.GROK_API_KEY }}"},
              {"name":"DATABASE_URL","value":"${{ secrets.DATABASE_URL }}"},
              {"name":"JWT_SECRET","value":"${{ secrets.JWT_SECRET }}"},
              {"name":"ADMIN_USERNAME","value":"${{ secrets.ADMIN_USERNAME }}"},
              {"name":"ADMIN_PASSWORD","value":"${{ secrets.ADMIN_PASSWORD }}"}
            ]
