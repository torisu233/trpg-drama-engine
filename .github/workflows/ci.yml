name: CI

# Run on every push to any branch and on pull requests, so breakage shows up immediately.
on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (offline + Postgres)
    runs-on: ubuntu-latest
    # Integration tests hit a real PostgreSQL (dev/prod parity): start a throwaway service
    # container mapped to host 5433, matching docker-compose and the conftest default DATABASE_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: trpg
          POSTGRES_DB: trpg        # conftest connects here and creates the trpg_test database
        ports:
          - 5433:5432
        # Wait until Postgres is actually ready to avoid connection races
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # cache: pip reuses downloaded dependencies on later runs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # requirements-dev.txt includes requirements.txt plus pytest / pytest-cov
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tests never call the LLM (conftest sets a dummy key), so CI needs no secrets.
      # Integration tests use the Postgres service above (conftest default: localhost:5433/trpg_test).
      - name: Run pytest
        run: pytest

  # After tests pass on master: build the image, push to Artifact Registry, deploy to Cloud Run.
  # The hosted service has been shut down; this job only runs when the repository variable
  # DEPLOY_ENABLED is set to 'true' (plus the GCP variables and secrets below).
  deploy:
    name: Build & deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write                        # exchange a GitHub OIDC token for short-lived GCP credentials
      contents: read
    env:
      IMAGE: ${{ vars.GCP_IMAGE }}           # <region>-docker.pkg.dev/<project>/trpg/trpg
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation (no long-lived keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push (tagged latest and git sha)
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # Deploy the exact sha just built (not :latest).
      # --add-cloudsql-instances: Cloud Run's built-in connector mounts the Cloud SQL unix socket
      #   (DATABASE_URL uses ?host=/cloudsql/<connection-name>).
      # --service-account: run as the runtime SA that holds cloudsql.client. --timeout 600 allows long streams.
      # Secrets are injected with --set-env-vars; ^~^ switches the delimiter so the = / @ : characters
      # inside DATABASE_URL are not misparsed.
      - name: Deploy to Cloud Run (create or update)
        run: |
          gcloud run deploy trpg \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUN_SA }}" \
            --add-cloudsql-instances "${{ vars.GCP_SQL_CONN }}" \
            --allow-unauthenticated \
            --timeout 600 \
            --max-instances 3 \
            --set-env-vars "^~^DATABASE_URL=${{ secrets.DATABASE_URL }}~JWT_SECRET=${{ secrets.JWT_SECRET }}~ADMIN_USERNAME=${{ vars.ADMIN_USERNAME }}~ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}~LLM_API_KEY=${{ secrets.LLM_API_KEY }}"

      - name: Print service URL
        run: gcloud run services describe trpg --region "${{ vars.GCP_REGION }}" --format='value(status.url)'
