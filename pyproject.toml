# 专案工具配置。这里放 pytest 与 coverage 的设定（取代散落的 pytest.ini/.coveragerc）。
[tool.pytest.ini_options]
testpaths = ["tests"]          # 只在 tests/ 找测试
pythonpath = ["."]             # 把仓库根加进 import 路径，让 `import backend.xxx` 可用
addopts = "-q --cov=backend --cov-report=term-missing"   # 默认安静模式 + 覆盖率报告

[tool.coverage.run]
source = ["backend"]
# 这些是会打 Grok 的 live 诊断脚本，不在离线测试范围，排除以免拉低覆盖率数字
omit = [
    "backend/mode_test.py",
    "backend/author_test.py",
]
