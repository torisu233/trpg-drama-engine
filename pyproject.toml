# Tool configuration: pytest and coverage (instead of scattered pytest.ini / .coveragerc).
[tool.pytest.ini_options]
testpaths = ["tests"]          # only collect tests from tests/
pythonpath = ["."]             # repo root on the import path so `import backend.xxx` works
addopts = "-q --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
# Live diagnostic scripts that call the real LLM; outside the offline suite, so excluded from coverage
omit = [
    "backend/mode_test.py",
    "backend/author_test.py",
]
