# Local development database: PostgreSQL, same engine as production (dev/prod parity).
#   Start: docker compose up -d --wait     Stop: docker compose down (data kept in the volume)
#   Wipe data: docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trpg
      POSTGRES_PASSWORD: trpg
      POSTGRES_DB: trpg
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpg -d trpg"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional DB browser at http://localhost:8888 (system PostgreSQL, server db, user/password trpg)
  adminer:
    image: adminer
    ports:
      - "8888:8080"
    depends_on:
      - db

volumes:
  pgdata:
